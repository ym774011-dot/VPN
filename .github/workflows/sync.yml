name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # 本仓库为独立仓库（与上游无共同历史），git pull 会报
          # refusing to merge unrelated histories，故改用文件覆盖式同步：
          # 覆盖上游全部文件，仅保留本地专属的 wrangler.toml、.github、_autodeploy_check.md
          git checkout upstream/main -- . ':(exclude).github' ':(exclude)wrangler.toml'

          if git diff --cached --quiet; then
            echo "上游无新变化，跳过提交"
          else
            UP_VER=$(grep -m1 -oP "Version = '\K[^']+" _worker.js || echo unknown)
            git commit -m "Sync upstream: ${UP_VER}"
            git push origin main
            echo "已同步上游版本: ${UP_VER}"
          fi
